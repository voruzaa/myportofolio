<div id="add-education-modal" class="project-form-modal" popover="auto"
     role="dialog" aria-modal="true" aria-labelledby="add-education-modal-title">
    <button type="button" class="project-form-modal__backdrop"
            popovertarget="add-education-modal" popovertargetaction="hide"
            aria-label="Tutup form tambah pendidikan"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close"
                popovertarget="add-education-modal" popovertargetaction="hide"
                aria-label="Tutup form tambah pendidikan">&times;</button>
        <h2 id="add-education-modal-title">Tambah Education</h2>
        <form id="education-form" method="post" action="{% url 'main:create_education_ajax' %}"
              class="project-form">
            {% csrf_token %}
            <p id="education-form-errors" class="form-error" role="alert" hidden></p>
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary"
                        popovertarget="add-education-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Education</button>
            </div>
        </form>
    </div>
</div>
